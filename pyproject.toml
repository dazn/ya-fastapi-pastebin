[project]
name = "pastebin"
version = "0.1.0"
description = "A simple pastebin service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pastebin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
