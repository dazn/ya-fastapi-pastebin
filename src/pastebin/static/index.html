<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pastebin</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    line-height: 1.4;
    max-width: 48rem;
    margin: 2rem auto;
    padding: 0 1rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  form {
    display: grid;
    gap: .6rem;
    margin-bottom: 2rem;
    padding: 1rem;
    border: 2px dashed #888;
    border-radius: .4rem;
  }
  form.drag-over { border-color: Highlight; background: #8882; }
  #file-help { margin: 0; font-size: .9rem; }
  textarea {
    width: 100%;
    min-height: 7rem;
    box-sizing: border-box;
    padding: .5rem;
    font: inherit;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    resize: vertical;
  }
  .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
  button { font: inherit; padding: .4rem 1.2rem; cursor: pointer; }
  button:disabled { cursor: default; opacity: .5; }
  #status { color: #d33; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1rem; }
  li { border: 1px solid #8884; border-radius: .4rem; overflow: hidden; }
  li.empty { border: none; opacity: .6; }
  li header {
    display: flex;
    align-items: center;
    gap: .4rem;
    font-size: .85rem;
    opacity: .75;
    padding: .3rem .7rem;
    border-bottom: 1px solid #8884;
    background: #8881;
  }
  .delete {
    display: inline-grid;
    place-items: center;
    width: 1.7rem;
    height: 1.7rem;
    padding: .2rem;
    border: 0;
    border-radius: .25rem;
    color: inherit;
    background: transparent;
  }
  .delete:hover, .delete:focus-visible { color: #d33; background: #8882; }
  .delete svg { width: 1.2rem; height: 1.2rem; }
  li .body { padding: .6rem .7rem; }
  pre {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<h1>Pastebin</h1>

<form id="paste-form">
  <textarea id="text" name="text" aria-label="Paste text" placeholder="Paste text here…"></textarea>
  <p id="file-help">Drop one file anywhere in this box or choose a file, then click Paste.
    Clear any text first. Files only, up to 100 MiB; no folders.</p>
  <div class="row">
    <label for="file">File</label>
    <input id="file" name="file" type="file" aria-describedby="file-help">
    <button id="submit" type="submit" disabled>Paste</button>
    <span id="status" role="status"></span>
  </div>
</form>

<ul id="pastes"></ul>

<template id="paste-tpl">
  <li>
    <header>
      <time></time>
      <button class="delete" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-2 6h10l-1 12H8L7 9Zm3 2v8h2v-8h-2Zm4 0v8h2v-8h-2Z"/>
        </svg>
      </button>
    </header>
    <div class="body"></div>
  </li>
</template>

<script>
(() => {
  const form = document.getElementById('paste-form');
  const textarea = document.getElementById('text');
  const fileInput = document.getElementById('file');
  const submit = document.getElementById('submit');
  const status = document.getElementById('status');
  const list = document.getElementById('pastes');
  const tpl = document.getElementById('paste-tpl');
  let busy = false;
  let dragDepth = 0;

  function clearDrag() {
    dragDepth = 0;
    form.classList.remove('drag-over');
  }

  // Text and file are mutually exclusive; only one request in flight at a time.
  function updateState() {
    const hasText = textarea.value.trim() !== '';
    const hasFile = fileInput.files.length === 1;
    fileInput.disabled = busy || textarea.value !== '';
    textarea.disabled = busy || hasFile;
    submit.disabled = busy || hasText === hasFile;
    if (fileInput.disabled) clearDrag();
  }

  function isFileDrag(event) {
    return event.dataTransfer && Array.from(event.dataTransfer.types).includes('Files');
  }

  function canDrop(event) {
    const items = Array.from(event.dataTransfer.items);
    return form.contains(event.target) && !fileInput.disabled &&
      items.filter(item => item.kind === 'file').length <= 1;
  }

  // Capture file drags even over disabled controls. Leave ordinary text drags alone.
  document.addEventListener('dragenter', (event) => {
    if (!isFileDrag(event)) return;
    event.preventDefault();
    if (form.contains(event.target)) {
      dragDepth += 1;
      form.classList.toggle('drag-over', canDrop(event));
    } else {
      clearDrag();
    }
  }, true);

  document.addEventListener('dragover', (event) => {
    if (!isFileDrag(event)) return;
    event.preventDefault();
    const allowed = canDrop(event);
    // Keep drops inside the form deliverable so rejected drops can be explained.
    event.dataTransfer.dropEffect = form.contains(event.target) ? 'copy' : 'none';
    form.classList.toggle('drag-over', allowed);
  }, true);

  document.addEventListener('dragleave', (event) => {
    if (!isFileDrag(event) || !form.contains(event.target)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) clearDrag();
  }, true);

  document.addEventListener('drop', (event) => {
    if (!isFileDrag(event)) return;
    event.preventDefault();
    clearDrag();
    if (!form.contains(event.target)) return;
    if (busy) {
      status.textContent = 'An upload is in progress. Wait before choosing another file.';
      return;
    }
    if (textarea.value !== '') {
      status.textContent = 'Clear the text before choosing a file.';
      return;
    }
    const items = Array.from(event.dataTransfer.items).filter(item => item.kind === 'file');
    if (items.some(item => item.webkitGetAsEntry?.()?.isDirectory)) {
      status.textContent = 'Folders cannot be pasted. Drop one file.';
      return;
    }
    const files = event.dataTransfer.files;
    if (files.length !== 1 || items.length > 1) {
      status.textContent = 'Drop exactly one file at a time.';
      return;
    }
    fileInput.files = files;
    status.textContent = '';
    updateState();
  }, true);

  document.addEventListener('dragend', clearDrag, true);
  window.addEventListener('blur', clearDrag);

  function showEmptyState() {
    list.replaceChildren();
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = 'Nothing pasted yet.';
    list.append(li);
  }

  async function deletePaste(paste, node, button) {
    button.disabled = true;
    status.textContent = '';
    try {
      const name = encodeURIComponent(paste.name);
      const res = await fetch(`/api/pastes/${name}`, { method: 'DELETE' });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { detail = (await res.json()).detail || detail; } catch (_) { /* not JSON */ }
        throw new Error(detail);
      }
      node.remove();
      if (list.children.length === 0) showEmptyState();
    } catch (err) {
      button.disabled = false;
      status.textContent = `Delete failed for ${paste.name}: ${err.message}`;
    }
  }

  function render(pastes) {
    list.replaceChildren();
    if (pastes.length === 0) {
      showEmptyState();
      return;
    }
    for (const p of pastes) {
      const node = tpl.content.firstElementChild.cloneNode(true);
      const time = node.querySelector('time');
      time.dateTime = p.created_at;
      time.textContent = new Date(p.created_at).toLocaleString();
      const deleteButton = node.querySelector('.delete');
      const deleteLabel = `Delete ${p.name}`;
      deleteButton.setAttribute('aria-label', deleteLabel);
      deleteButton.title = deleteLabel;
      deleteButton.addEventListener('click', () => deletePaste(p, node, deleteButton));
      const body = node.querySelector('.body');
      if (p.type === 'text') {
        const pre = document.createElement('pre');
        pre.textContent = p.text;           // verbatim, never interpreted as HTML
        body.append(pre);
      } else {
        const a = document.createElement('a');
        a.href = p.url;
        a.download = p.name;
        a.textContent = p.name;
        body.append(a);
      }
      list.append(node);
    }
  }

  async function load() {
    try {
      const res = await fetch('/api/pastes', { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      render(await res.json());
    } catch (err) {
      status.textContent = `Could not load pastes: ${err.message}`;
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    const body = new FormData();
    if (fileInput.files.length === 1) body.append('file', fileInput.files[0]);
    else body.append('text', textarea.value);
    busy = true;
    status.textContent = '';
    updateState();
    try {
      const res = await fetch('/api/pastes', { method: 'POST', body });
      if (!res.ok) {
        let detail = `HTTP ${res.status}`;
        try { detail = (await res.json()).detail || detail; } catch (_) { /* not JSON */ }
        throw new Error(detail);
      }
      form.reset();
      status.textContent = '';
    } catch (err) {
      status.textContent = `Paste failed: ${err.message}`;
    } finally {
      busy = false;
      updateState();
      load();
    }
  });

  textarea.addEventListener('input', updateState);
  fileInput.addEventListener('change', () => {
    status.textContent = '';
    updateState();
  });
  form.addEventListener('reset', () => setTimeout(updateState));
  updateState();
  load();
})();
</script>
</body>
</html>
